<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aibo-chan Robo Dog AI Communication</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header status bar -->
        <header class="status-bar">
            <div class="status-item"><span class="icon">⚡</span> <span id="battery-level">98%</span></div>
            <div class="status-title">AIBO-ROBO v1.0</div>
            <div class="status-item"><span class="icon">📶</span> <span id="mode-badge">FREE CHAT</span></div>
        </header>

        <!-- Main Display / Stage -->
        <main class="stage">
            <!-- 3D / Interactive Canvas Container -->
            <div class="dog-container" id="dog-stage">
                <!-- SVG Interactive Robo Dog with Dynamic LCD Display Face -->
                <svg id="robo-dog-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Glow Effect -->
                        <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                        <filter id="heart-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                        <!-- Metallic Gradients -->
                        <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f0f4f8" />
                            <stop offset="50%" stop-color="#d9e2ec" />
                            <stop offset="100%" stop-color="#bcccdc" />
                        </linearGradient>
                        <linearGradient id="joint-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#627d98" />
                            <stop offset="100%" stop-color="#334e68" />
                        </linearGradient>
                        <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0066cc" />
                            <stop offset="100%" stop-color="#003366" />
                        </linearGradient>
                    </defs>

                    <!-- Shadow -->
                    <ellipse cx="250" cy="440" rx="140" ry="20" fill="rgba(0,0,0,0.15)" />

                    <!-- DOG BODY GROUP -->
                    <g id="dog-body" class="bounce-idle">
                        <!-- Tail -->
                        <g id="dog-tail" class="wag-tail">
                            <path d="M 360 260 Q 420 220 400 160 Q 380 160 370 230 Z" fill="url(#body-grad)" stroke="#486581" stroke-width="4" stroke-linejoin="round" />
                            <circle cx="400" cy="160" r="14" fill="#334e68" />
                        </g>

                        <!-- Back Legs -->
                        <g id="leg-back-left">
                            <rect x="330" y="290" width="30" height="110" rx="15" fill="url(#body-grad)" stroke="#486581" stroke-width="4" />
                            <circle cx="345" cy="400" r="18" fill="url(#joint-grad)" />
                        </g>
                        <g id="leg-back-right">
                            <rect x="290" y="300" width="30" height="110" rx="15" fill="url(#body-grad)" stroke="#486581" stroke-width="4" />
                            <circle cx="305" cy="410" r="18" fill="url(#joint-grad)" />
                        </g>

                        <!-- Main Body -->
                        <rect x="180" y="230" width="190" height="110" rx="45" fill="url(#body-grad)" stroke="#486581" stroke-width="5" />
                        <!-- Body Accent Plate -->
                        <rect x="210" y="250" width="130" height="70" rx="20" fill="#e4e7eb" stroke="#9fb3c8" stroke-width="3" />
                        <circle cx="275" cy="285" r="12" fill="#00d9ff" filter="url(#cyan-glow)" />

                        <!-- Front Legs -->
                        <g id="leg-front-left">
                            <rect x="210" y="290" width="30" height="110" rx="15" fill="url(#body-grad)" stroke="#486581" stroke-width="4" />
                            <circle cx="225" cy="400" r="18" fill="url(#joint-grad)" />
                        </g>
                        <g id="leg-front-right">
                            <rect x="160" y="300" width="30" height="110" rx="15" fill="url(#body-grad)" stroke="#486581" stroke-width="4" />
                            <circle cx="175" cy="410" r="18" fill="url(#joint-grad)" />
                        </g>

                        <!-- Neck Joint -->
                        <circle cx="170" cy="220" r="22" fill="url(#joint-grad)" />

                        <!-- DOG HEAD GROUP -->
                        <g id="dog-head">
                            <!-- Ears -->
                            <g id="ear-left" class="flop-ear">
                                <path d="M 120 120 Q 70 140 85 220 Q 120 200 130 150 Z" fill="#334e68" stroke="#102a43" stroke-width="3" />
                            </g>
                            <g id="ear-right" class="flop-ear-r">
                                <path d="M 220 120 Q 270 140 255 220 Q 220 200 210 150 Z" fill="#334e68" stroke="#102a43" stroke-width="3" />
                            </g>

                            <!-- Outer Helmet/Head Structure -->
                            <rect x="100" y="100" width="140" height="120" rx="35" fill="url(#body-grad)" stroke="#486581" stroke-width="5" />

                            <!-- LCD Display Screen Face -->
                            <rect x="112" y="112" width="116" height="96" rx="22" fill="url(#screen-grad)" stroke="#00d9ff" stroke-width="3" filter="url(#cyan-glow)" />

                            <!-- DYNAMIC LCD FACE FEATURES (Controlled via JS) -->
                            <g id="lcd-face-content">
                                <!-- LEFT EYE -->
                                <g id="eye-left">
                                    <circle id="eye-left-bg" cx="142" cy="150" r="14" fill="#ffffff" />
                                    <circle id="eye-left-pupil" cx="144" cy="150" r="7" fill="#001122" />
                                    <circle id="eye-left-sparkle" cx="140" cy="146" r="3" fill="#ffffff" />
                                </g>

                                <!-- RIGHT EYE -->
                                <g id="eye-right">
                                    <circle id="eye-right-bg" cx="198" cy="150" r="14" fill="#ffffff" />
                                    <circle id="eye-right-pupil" cx="196" cy="150" r="7" fill="#001122" />
                                    <circle id="eye-right-sparkle" cx="194" cy="146" r="3" fill="#ffffff" />
                                </g>

                                <!-- HEART EYES (Hidden by default) -->
                                <g id="eyes-heart" style="display:none;">
                                    <path d="M 142 155 C 142 155 130 145 134 139 C 138 134 142 140 142 140 C 142 140 146 134 150 139 C 154 145 142 155 142 155 Z" fill="#ff4081" filter="url(#heart-glow)" />
                                    <path d="M 198 155 C 198 155 186 145 190 139 C 194 134 198 140 198 140 C 198 140 202 134 206 139 C 210 145 198 155 198 155 Z" fill="#ff4081" filter="url(#heart-glow)" />
                                </g>

                                <!-- CHEEKS (Blush) -->
                                <circle id="cheek-left" cx="130" cy="168" r="8" fill="rgba(255,105,180,0.5)" />
                                <circle id="cheek-right" cx="210" cy="168" r="8" fill="rgba(255,105,180,0.5)" />

                                <!-- DYNAMIC MOUTH (LIP-SYNC TARGET) -->
                                <path id="mouth-path" d="M 155 178 Q 170 190 185 178" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- Petting Touch Area / Heart particle trigger -->
            <div id="touch-overlay"></div>

            <!-- Speech Bubble for Dog Response -->
            <div class="speech-bubble-container" id="speech-box">
                <div class="speech-bubble" id="dog-speech-text">ワン！ボクと遊ぼうワン！</div>
            </div>
        </main>

        <!-- Action Control Panel -->
        <section class="controls-panel">
            <!-- Emotion/Action Quick Buttons -->
            <div class="quick-actions">
                <button class="action-btn" onclick="triggerAction('pet')">🖐️ なでる</button>
                <button class="action-btn" onclick="triggerAction('sit')">🦴 おすわり</button>
                <button class="action-btn" onclick="triggerAction('bark')">🔊 ワン！</button>
                <button class="action-btn" onclick="triggerAction('dance')">💃 ダンス</button>
            </div>

            <!-- API Key Input Toggle Modal / Bar -->
            <div class="api-settings">
                <details>
                    <summary>⚙️ ChatGPT (OpenAI) APIキー設定</summary>
                    <div class="api-input-group">
                        <input type="password" id="api-key-input" placeholder="sk-proj-..." />
                        <button onclick="saveApiKey()">保存</button>
                    </div>
                    <small>※キー未入力でもプリセット会話・デモ応答で遊べます！</small>
                </details>
            </div>

            <!-- Chat & Voice Input Box -->
            <div class="input-bar">
                <button id="mic-btn" class="icon-btn" onclick="toggleVoiceInput()" title="音声入力">🎤</button>
                <input type="text" id="chat-input" placeholder="アイボちゃんに話しかけてね..." onkeypress="handleKeyPress(event)" />
                <button id="send-btn" class="send-btn" onclick="sendMessage()">送信</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
